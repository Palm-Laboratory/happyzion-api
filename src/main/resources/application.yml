spring:
  application:
    name: happyzion-api
  servlet:
    multipart:
      enabled: true
      max-file-size: ${HAPPYZION_MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${HAPPYZION_MULTIPART_MAX_REQUEST_SIZE:220MB}
      file-size-threshold: 2MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/happyzion}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cache:
    public-menu:
      ttl: ${PUBLIC_MENU_CACHE_TTL:PT10M}

admin:
  jwt-secret: ${ADMIN_JWT_SECRET:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://happyzion.com,https://www.happyzion.com}

happyzion.uploads.root-path: ${HAPPYZION_UPLOAD_ROOT:/opt/happyzion/uploads}
happyzion.uploads.public-base-url: ${HAPPYZION_UPLOAD_PUBLIC_BASE_URL:https://api.happyzion.com/upload}

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  channel-id: ${YOUTUBE_CHANNEL_ID:}

pii:
  encryption:
    keys: ${HAPPYZION_PII_ENCRYPTION_KEYS:}
    active-key-id: ${HAPPYZION_PII_ENCRYPTION_ACTIVE_KEY_ID:}
    hash-key: ${HAPPYZION_PII_HASH_KEY:}

happyzion:
  aligo:
    base-url: https://apis.aligo.in
    user-id: ${ALIGO_USER_ID:replace-me}
    api-key: ${ALIGO_API_KEY:replace-me}
    sender: ${ALIGO_SENDER:01012345678}
    testmode: ${ALIGO_TESTMODE:true}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
