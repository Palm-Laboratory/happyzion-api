spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/happyzion}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

pii:
  encryption:
    keys: ${HAPPYZION_PII_ENCRYPTION_KEYS:v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    active-key-id: ${HAPPYZION_PII_ENCRYPTION_ACTIVE_KEY_ID:v1}
    hash-key: ${HAPPYZION_PII_HASH_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

happyzion:
  uploads:
    root-path: ${HAPPYZION_UPLOAD_ROOT:${user.dir}/.local/uploads}
    public-base-url: ${HAPPYZION_UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/upload}

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
