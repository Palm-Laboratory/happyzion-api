# HTTP context snippet: shared upload-asset rate limit and origin/referrer allowlist maps.
# Install this file where nginx includes directives inside the top-level http block,
# such as /etc/nginx/conf.d/happyzion-upload-http-context.conf.
limit_req_zone $binary_remote_addr zone=happyzion_upload:10m rate=20r/s;

map $http_referer $happyzion_upload_referer_allowed {
    default 0;
    "" 1;
    ~^https?://(happyzion\.org|www\.happyzion\.org|api\.happyzion\.org)(/|$) 1;
}

map $http_origin $happyzion_upload_origin_allowed {
    default 0;
    "" 1;
    "https://happyzion.org" 1;
    "https://www.happyzion.org" 1;
    "https://api.happyzion.org" 1;
}

map "$happyzion_upload_referer_allowed:$happyzion_upload_origin_allowed" $happyzion_upload_allowed {
    default 0;
    ~^1: 1;
    ~:1$ 1;
}
